<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="nestaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34443A" />
      <stop offset="100%" stop-color="#526350" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BDD2BC" />
      <stop offset="100%" stop-color="#8FA48C" />
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded edges -->
  <rect width="512" height="512" rx="128" fill="url(#nestaGrad)" />
  <!-- Protective Nest Motif / Mother and Child Silhouette -->
  <circle cx="256" cy="256" r="160" stroke="#FAF8F5" stroke-opacity="0.12" stroke-width="4" fill="none" />
  <!-- Heart and caring embrace symbol -->
  <path d="M190 320 C170 240, 220 180, 280 180 C330 180, 360 215, 360 260 C360 330, 240 350, 280 395" 
        stroke="url(#goldGrad)" stroke-width="26" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Baby dot / gentle spark -->
  <circle cx="320" cy="165" r="28" fill="#FAF8F5" />
  <!-- Pulse accent -->
  <path d="M150 280 L200 280 L220 250 L250 310 L275 270 L295 280 L350 280" 
        stroke="#EADECF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
</svg>
